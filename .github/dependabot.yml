version: 2
updates:
  # Every version update waits 3 days after a release before Dependabot
  # proposes it, so a hijacked release has time to be pulled first. Security
  # updates ignore the cooldown.

  # Gradle plugins and Android/Kotlin libraries (gradle/libs.versions.toml).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
          - "com.google.android.material:*"

  # GitHub Actions used by the workflows. Actions are pinned to commit SHAs;
  # Dependabot keeps the pins current and updates the version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
