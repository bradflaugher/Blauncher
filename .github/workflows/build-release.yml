name: Build and release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# One release pipeline at a time; never cancel a run that may be
# mid-way through replacing the published release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLAUNCHER_VERSION_CODE: ${{ github.run_number }}
      BLAUNCHER_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # API 37 platforms install as platforms;android-37.0 (not android-37).
      # setup-android@v4 ships cmdline-tools that can see the 37.x packages.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Restore signing keystore
        if: github.event_name == 'push'
        env:
          BLAUNCHER_KEYSTORE_BASE64: ${{ secrets.BLAUNCHER_KEYSTORE_BASE64 }}
          BLAUNCHER_STORE_PASSWORD: ${{ secrets.BLAUNCHER_STORE_PASSWORD }}
          BLAUNCHER_KEY_ALIAS: ${{ secrets.BLAUNCHER_KEY_ALIAS }}
          BLAUNCHER_KEY_PASSWORD: ${{ secrets.BLAUNCHER_KEY_PASSWORD }}
        run: |
          missing=()
          for variable in BLAUNCHER_KEYSTORE_BASE64 BLAUNCHER_STORE_PASSWORD BLAUNCHER_KEY_ALIAS BLAUNCHER_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              missing+=("$variable")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/blauncher-release.jks"
          if ! printf '%s' "$BLAUNCHER_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"; then
            printf 'BLAUNCHER_KEYSTORE_BASE64 is not valid base64\n' >&2
            exit 1
          fi
          if [ ! -s "$keystore_path" ]; then
            printf 'The restored signing keystore is empty\n' >&2
            exit 1
          fi
          printf 'BLAUNCHER_KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      # Signing is all-or-nothing in app/build.gradle, and the keystore (with
      # BLAUNCHER_KEYSTORE_PATH) is only restored on push. Pass the remaining
      # signing variables only on push too, so pull requests configure a
      # clean unsigned build instead of failing as partially configured.
      - name: Lint, test, and build release APK and bundle
        env:
          BLAUNCHER_STORE_PASSWORD: ${{ github.event_name == 'push' && secrets.BLAUNCHER_STORE_PASSWORD || '' }}
          BLAUNCHER_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.BLAUNCHER_KEY_ALIAS || '' }}
          BLAUNCHER_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.BLAUNCHER_KEY_PASSWORD || '' }}
        run: ./gradlew lint test assembleRelease bundleRelease

      # The APK is for sideloading; the bundle (.aab) is what Google Play takes,
      # and the R8 mapping deobfuscates Play crash reports.
      - name: Name signed APK, bundle and mapping
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          mv app/build/outputs/apk/release/app-release.apk dist/Blauncher.apk
          mv app/build/outputs/bundle/release/app-release.aab dist/Blauncher.aab
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blauncher-release-${{ github.run_number }}
          path: ${{ github.event_name == 'push' && 'dist/' || 'app/build/outputs/apk/release/*.apk' }}
          if-no-files-found: error

  # Play rejects an edit whose listing breaks its limits, so pull requests
  # check fastlane/metadata (text, image sizes and formats) before it can
  # reach main, and that the locked
  # fastlane still installs on the runner's Ruby.
  store-listing:
    name: store listing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_FROZEN: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_HIDE_CHANGELOG: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pillow decodes every listing image; Ubuntu's own package, so no
      # unpinned download from PyPI.
      - name: Install Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-pil

      - name: Check listing text and images against Play's limits
        run: /usr/bin/python3 .github/scripts/check_store_listing.py

      # Native gem extensions are built for the runner's Ruby, so its
      # version is part of the cache key.
      - name: Find Ruby version
        id: ruby
        run: printf 'version=%s\n' "$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"

      - name: Cache fastlane gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-ruby${{ steps.ruby.outputs.version }}-gems-${{ hashFiles('Gemfile.lock') }}

      - name: Install fastlane
        run: |
          sudo gem install bundler --version "$(tail -n 1 Gemfile.lock | tr -d ' ')" --no-document
          bundle install
      - name: Check that fastlane runs
        run: bundle exec fastlane supply --help > /dev/null

  # Every signed main build goes to Google Play's Closed testing - Alpha
  # track, with changelogs/default.txt as its release notes, and the store
  # listing is synced from fastlane/metadata/android: text, icon, feature
  # graphic and screenshots (images Play already has are skipped by
  # checksum). Promotion to production is play-promote.yml, run by hand.
  play:
    name: Google Play
    if: github.event_name == 'push'
    needs: [build, store-listing]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PLAY_SERVICE_ACCOUNT_JSON is an environment secret, and only main can
    # deploy to google-play, so no other branch's workflow can read it.
    environment: google-play
    # One Play edit at a time: a promotion and an upload never overlap.
    concurrency:
      group: google-play
      cancel-in-progress: false
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_FROZEN: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_HIDE_CHANGELOG: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed bundle and mapping
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blauncher-release-${{ github.run_number }}
          path: release

      # Native gem extensions are built for the runner's Ruby, so its
      # version is part of the cache key.
      - name: Find Ruby version
        id: ruby
        run: printf 'version=%s\n' "$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"

      - name: Cache fastlane gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-ruby${{ steps.ruby.outputs.version }}-gems-${{ hashFiles('Gemfile.lock') }}

      - name: Install fastlane
        run: |
          sudo gem install bundler --version "$(tail -n 1 Gemfile.lock | tr -d ' ')" --no-document
          bundle install

      - name: Upload to Closed testing - Alpha
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            printf 'No PLAY_SERVICE_ACCOUNT_JSON secret in the google-play environment\n' >&2
            exit 1
          fi
          key="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$key"
          bundle exec fastlane supply \
            --package_name com.bradflaugher.blauncher \
            --json_key "$key" \
            --aab release/Blauncher.aab \
            --mapping release/mapping.txt \
            --track alpha \
            --release_status completed \
            --metadata_path fastlane/metadata/android \
            --sync_image_upload true

  release:
    name: release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # publish the new GitHub release, delete the previous one
      id-token: write # sign the build provenance attestation (OIDC)
      attestations: write # store the attestation

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blauncher-release-${{ github.run_number }}
          path: release-apk

      # Signed build provenance for the APK and bundle: anyone can check a
      # download came from this repository's CI with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-apk/Blauncher.apk
            release-apk/Blauncher.aab

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hash from inside the folder so the file names Blauncher.apk, not
          # release-apk/Blauncher.apk, and `sha256sum -c` works next to a download.
          (cd release-apk && sha256sum Blauncher.apk | tee Blauncher.apk.sha256)

          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          fi
          gh release create latest release-apk/Blauncher.apk release-apk/Blauncher.apk.sha256 \
            release-apk/Blauncher.aab release-apk/mapping.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Blauncher latest" \
            --notes "Latest signed build from commit ${GITHUB_SHA}. Sideload Blauncher.apk; Blauncher.aab and mapping.txt are for Google Play."

          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '.[] | select(.tagName | startswith("build-")) | .tagName' |
          while read -r old_tag; do
            gh release delete "$old_tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          done
