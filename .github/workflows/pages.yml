name: Pages

# The website and privacy policy in site/, published to GitHub Pages.
# Pull requests that touch it only run the check; pushes to main check it
# and deploy it.
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/scripts/check_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/scripts/check_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel one part-way through.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every page parses, every local link and asset exists, and nothing
      # loads from another origin.
      - name: Check site
        run: python3 .github/scripts/check_site.py site

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: check
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # prove the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
